[package]
name = "jit-proxy"
version = "0.21.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "jit_proxy"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "velocity/idl-build"]

[dependencies]
anchor-lang = "1.0.2"
anchor-spl = "1.0.2"
bytemuck = { version = "1.4.0" }
velocity = { git = "https://github.com/velocity-exchange/velocity-v1.git", rev = "4bfc271fe2687aef2201077b10e40f2eac364424", features = ["cpi", "mainnet-beta"] }
static_assertions = "1.1.0"
solana-program = "3"
