name: main

on:
  push:
    branches: master
  pull_request:
    branches: master

defaults:
  run:
    shell: bash
    working-directory: .

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.91.1
  SOLANA_VERSION: '2.3.11'
  # solanafoundation/solana-verifiable-build tags lag behind agave releases;
  # check https://hub.docker.com/r/solanafoundation/solana-verifiable-build/tags
  VERIFIABLE_BUILD_IMAGE: solanafoundation/solana-verifiable-build:3.1.14

jobs:
  verified-build:
    name: Build Verifiable Artifact
    runs-on: ubicloud
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      - name: Install Solana Verify
        run: |
          cargo install solana-verify --version 0.4.11 --locked
          solana-verify --version

      - name: Verifiable Build
        run: |
          solana-verify build --library-name jit_proxy -b ${{ env.VERIFIABLE_BUILD_IMAGE }}

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build
          path: target/deploy/jit_proxy.so
